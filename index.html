<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidey HUD Connection</title>
    <style>
        body { background-color: #090d10; color: #b9f36b; font-family: ui-monospace, monospace; text-align: center; padding: 50px 20px; }
        .spinner { margin: 24px auto; width: 40px; height: 40px; border: 4px solid rgba(185, 243, 107, 0.25); border-radius: 50%; border-top-color: #b9f36b; animation: spin 1s linear infinite; }
        .btn { display: inline-block; background: #ff704f; color: #101315; font-weight: 800; padding: 14px 24px; border-radius: 6px; text-decoration: none; margin-top: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2 id="status">CONNECTING TO HUD...</h2>
    <div id="loading" class="spinner"></div>
    <p id="msg">Initializing secure PKCE handshake.</p>
    <a id="retryBtn" class="btn" style="display:none;">SEND TO HUD (TURN ON WIFI FIRST)</a>

    <script>
        const clientId = '1125aef5fc29462098e46e96ba3cb79f';
        const redirectUri = 'https://diveshpv.github.io/spidey-hud-bridge/';
        const scope = 'user-read-currently-playing user-modify-playback-state user-library-read playlist-read-private playlist-read-collaborative';

        function base64UrlEncode(buffer) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function generatePKCE() {
            const array = new Uint8Array(32);
            window.crypto.getRandomValues(array);
            const verifier = base64UrlEncode(array);
            const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
            const challenge = base64UrlEncode(digest);
            return { verifier, challenge };
        }

        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const stateParam = params.get('state');
        const ip = params.get('ip') || window.location.hash.substring(1);

        if (ip) {
            (async () => {
                sessionStorage.setItem('espIp', ip);
                const pkce = await generatePKCE();
                sessionStorage.setItem('pkceVerifier', pkce.verifier);
                const statePayload = encodeURIComponent(ip + "|" + pkce.verifier);
                document.getElementById('msg').innerText = "Redirecting to Spotify...";
                const authUrl = "https://accounts.spotify.com/authorize?client_id=" + clientId +
                                "&response_type=code&redirect_uri=" + encodeURIComponent(redirectUri) +
                                "&code_challenge_method=S256&code_challenge=" + pkce.challenge +
                                "&state=" + statePayload +
                                "&scope=" + encodeURIComponent(scope);
                window.location.href = authUrl;
            })();
        } else if (code) {
            (async () => {
                let savedIp = sessionStorage.getItem('espIp') || "";
                let verifier = sessionStorage.getItem('pkceVerifier') || "";
                if (stateParam) {
                    const parts = decodeURIComponent(stateParam).split('|');
                    if (parts[0]) savedIp = parts[0];
                    if (parts[1]) verifier = parts[1];
                }
                if (!savedIp) {
                    document.getElementById('status').innerText = "SESSION LOST";
                    document.getElementById('msg').innerText = "Please scan the QR code on your HUD again.";
                    document.getElementById('loading').style.display = 'none';
                    return;
                }

                let targetUrl = "http://" + savedIp + "/callback?code=" + encodeURIComponent(code) + "&v=" + encodeURIComponent(verifier);
                try {
                    const body = new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: redirectUri,
                        code_verifier: verifier
                    });
                    const resp = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body.toString()
                    });
                    if (resp.ok) {
                        const data = await resp.json();
                        targetUrl = "http://" + savedIp + "/callback?r=" + encodeURIComponent(data.refresh_token) +
                                    "&a=" + encodeURIComponent(data.access_token) + "&e=" + (data.expires_in || 3600);
                    }
                } catch (e) {}

                document.getElementById('status').innerText = "AUTHENTICATED";
                document.getElementById('msg').innerText = "Transferring keys to your Spidey HUD (Make sure Phone Wi-Fi is ON)...";
                const btn = document.getElementById('retryBtn');
                btn.href = targetUrl;
                btn.style.display = 'inline-block';
                window.location.href = targetUrl;
            })();
        } else {
            document.getElementById('status').innerText = "AWAITING DEVICE";
            document.getElementById('msg').innerText = "Please scan the QR code on your Spidey HUD screen to begin.";
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
